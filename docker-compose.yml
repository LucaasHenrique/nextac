services:
    postgres:
        image: postgres:latest
        container_name: postgres
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: revise
        ports:
            - "5432:5432"
        volumes:
            - ./data:/var/lib/postgresql/data

    redis:
        image: redis:7-alpine
        container_name: revise-redis
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data

volumes:
    data:
    redis_data:
